<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Hub - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #080c14;
            --bg-secondary: #0f1729;
            --bg-card: #131d3a;
            --bg-card-hover: #1a2747;
            --border-color: #1e3156;
            --text-primary: #f0f4ff;
            --text-secondary: #94a9c9;
            --text-muted: #5a6f94;
            --cyan: #00d4ff;
            --cyan-glow: rgba(0, 212, 255, 0.15);
            --pink: #ff2d75;
            --pink-glow: rgba(255, 45, 117, 0.15);
            --green: #00e676;
            --orange: #ff9100;
            --radius: 14px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(8, 12, 20, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            will-change: transform;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--cyan), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .logo i {
            -webkit-text-fill-color: initial;
            color: var(--cyan);
            margin-right: 6px;
        }

        .header-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 20px;
            background: var(--cyan-glow);
            color: var(--cyan);
            border: 1px solid rgba(0, 212, 255, 0.2);
            letter-spacing: 0.5px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-bypass {
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            background: linear-gradient(135deg, var(--pink), #ff0055);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(255, 45, 117, 0.3);
        }
        .btn-bypass:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 45, 117, 0.5);
        }
        .btn-bypass i {
            font-size: 14px;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* ===== Hướng dẫn ===== */
        .guide-line {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 15px;
            padding: 10px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }
        .guide-line strong {
            color: var(--text-primary);
            background: rgba(0, 212, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 28px 30px;
            margin-bottom: 32px;
            display: none;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .admin-panel.active {
            display: block;
            animation: fadeSlideIn 0.4s ease;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-header h2 i {
            color: var(--cyan);
        }
        .admin-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 20px;
            background: var(--pink-glow);
            color: var(--pink);
            border: 1px solid rgba(255, 45, 117, 0.2);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-grid .full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-glow);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn-primary {
            padding: 11px 32px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            background: linear-gradient(135deg, var(--cyan), #0099cc);
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            will-change: transform;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 212, 255, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            padding: 11px 32px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }
        .btn-secondary:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .btn-secondary.active {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== POSTS GRID ===== */
        .posts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px 28px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            will-change: transform;
        }
        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--pink));
            opacity: 0;
            transition: var(--transition);
        }
        .post-card:hover {
            border-color: rgba(0, 212, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .post-card:hover::before {
            opacity: 1;
        }
        .post-card .post-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .post-card .post-title .post-id {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 12px;
        }
        .post-card .post-image {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 8px;
            margin: 12px 0 14px;
            border: 1px solid var(--border-color);
        }
        .post-card .post-desc {
            display: none;
        }
        .post-card .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .btn-download {
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            background: linear-gradient(135deg, var(--green), #00c853);
            color: #000;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            will-change: transform;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 230, 118, 0.3);
        }
        .btn-download:active {
            transform: scale(0.98);
        }
        .post-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-edit {
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            background: rgba(255, 170, 0, 0.15);
            color: var(--orange);
            border: 1px solid rgba(255, 170, 0, 0.2);
            cursor: pointer;
            transition: var(--transition);
            display: none;
            align-items: center;
            gap: 6px;
        }
        .btn-edit:hover {
            background: rgba(255, 170, 0, 0.25);
        }
        .btn-delete {
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            background: rgba(255, 45, 117, 0.15);
            color: var(--pink);
            border: 1px solid rgba(255, 45, 117, 0.2);
            cursor: pointer;
            transition: var(--transition);
            display: none;
            align-items: center;
            gap: 6px;
        }
        .btn-delete:hover {
            background: rgba(255, 45, 117, 0.25);
        }
        .btn-edit.active,
        .btn-delete.active {
            display: inline-flex;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            max-width: 750px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 18px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-close:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }
        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-right: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .modal-content {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .modal-content a {
            color: var(--cyan);
            text-decoration: underline;
            transition: var(--transition);
            font-weight: 600;
        }
        .modal-content a:hover {
            color: #66e0ff;
        }

        .modal-actions {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }
        .modal-download-btn {
            padding: 14px 40px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            background: linear-gradient(135deg, var(--green), #00c853);
            color: #000;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
            will-change: transform;
        }
        .modal-download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 230, 118, 0.5);
        }
        .modal-download-btn:active {
            transform: scale(0.98);
        }

        /* ===== FOOTER ADMIN ===== */
        .footer-admin {
            max-width: 960px;
            margin: 40px auto 0;
            padding: 24px 28px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            text-align: center;
        }
        .footer-admin h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .footer-admin h3 i {
            color: var(--cyan);
        }
        .footer-admin .login-area {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }
        .footer-admin .login-area input {
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            min-width: 220px;
            transition: var(--transition);
        }
        .footer-admin .login-area input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-glow);
        }
        .footer-admin .login-area .btn-login {
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            background: var(--cyan);
            color: #000;
            cursor: pointer;
            transition: var(--transition);
            will-change: transform;
        }
        .footer-admin .login-area .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }
        .footer-admin .login-area .btn-login:active {
            transform: scale(0.98);
        }
        .footer-admin .logout-area {
            display: none;
        }
        .footer-admin .logout-area.active {
            display: block;
        }
        .footer-admin .logout-area p {
            color: var(--green);
            font-weight: 600;
            margin-bottom: 10px;
        }
        .footer-admin .logout-area .btn-logout {
            padding: 10px 28px;
            border: 1px solid var(--pink);
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            background: transparent;
            color: var(--pink);
            cursor: pointer;
            transition: var(--transition);
        }
        .footer-admin .logout-area .btn-logout:hover {
            background: rgba(255, 45, 117, 0.1);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
            color: var(--border-color);
        }
        .empty-state h3 {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            gap: 12px;
            color: var(--text-muted);
        }
        .loading-spinner i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .logo {
                font-size: 18px;
            }
            .header-badge {
                font-size: 10px;
                padding: 3px 10px;
            }
            .btn-bypass {
                font-size: 13px;
                padding: 6px 16px;
            }
            .container {
                padding: 16px 14px 40px;
            }
            .admin-panel {
                padding: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .post-card {
                padding: 18px 20px;
            }
            .post-card .post-title {
                font-size: 18px;
            }
            .modal-box {
                padding: 20px;
            }
            .footer-admin {
                padding: 18px 16px;
            }
            .footer-admin .login-area {
                flex-direction: column;
            }
            .footer-admin .login-area input {
                min-width: unset;
                width: 100%;
            }
        }
        @media (max-width: 480px) {
            .header-right .btn-bypass span {
                display: none;
            }
            .header-right .btn-bypass i {
                margin: 0;
            }
        }

        /* ===== OPTIMIZATION ===== */
        .post-card,
        .btn-download,
        .modal-download-btn,
        .btn-bypass,
        .btn-primary,
        .btn-login,
        .btn-logout {
            -webkit-tap-highlight-color: transparent;
        }

        img {
            content-visibility: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <div class="logo"><i class="fa-solid fa-bolt"></i>Download<span style="-webkit-text-fill-color: var(--pink);">Hub</span></div>
            <span class="header-badge"><i class="fa-regular fa-circle-check"></i> v3.0</span>
        </div>
        <div class="header-right">
            <a href="https://tvinh19122012-boop.github.io/BYPASS-WEB" target="_blank" class="btn-bypass" rel="noopener">
                <i class="fa-solid fa-rocket"></i> <span>Bypass Key</span>
            </a>
        </div>
    </header>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <div class="guide-line">
            <i class="fa-regular fa-circle-question" style="margin-right: 8px;"></i> Ấn vào <strong>"Tải xuống"</strong> để xem các link tải.
        </div>

        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-header">
                <h2><i class="fa-solid fa-pen-to-square"></i> <span id="formHeading">Đăng bài viết mới</span></h2>
                <span class="admin-badge"><i class="fa-solid fa-shield-halved"></i> Quản trị</span>
            </div>
            <input type="hidden" id="editPostId" value="">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Tiêu đề</label>
                    <input type="text" id="postTitle" placeholder="Nhập tiêu đề bài viết...">
                </div>
                <div class="form-group full-width">
                    <label>Mô tả (Nơi chứa các link tải)</label>
                    <textarea id="postDesc" rows="4" placeholder="Nhập nội dung chứa các link vào đây...&#10;Ví dụ:&#10;Link tải game: https://example.com/game.apk&#10;Link dự phòng: https://example.com/backup"></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Link đích (Nút tải xuống ngay bên trong màn popup)</label>
                    <input type="text" id="postRedirect" placeholder="https://example.com/download">
                </div>
                <div class="form-group full-width">
                    <label>Hình ảnh</label>
                    <input type="file" id="imageUpload" accept="image/*" style="padding: 8px;">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn-primary" id="submitBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Đăng bài</button>
                <button class="btn-secondary" id="cancelEditBtn"><i class="fa-solid fa-xmark"></i> Hủy sửa</button>
            </div>
        </div>

        <!-- POSTS -->
        <div id="postsContainer">
            <div class="loading-spinner"><i class="fa-solid fa-spinner"></i> Đang tải dữ liệu...</div>
        </div>

    </div>

    <!-- ===== MODAL ===== -->
    <div id="downloadModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalTitle" class="modal-title">Tiêu đề bài viết</h3>
            <div id="modalContent" class="modal-content">Nội dung các link sẽ hiện ra ở đây...</div>

            <div class="modal-actions">
                <a id="modalDownloadBtn" href="#" target="_blank" rel="noopener" class="modal-download-btn" style="display: none;">
                    <i class="fa-solid fa-download"></i> Tải xuống ngay
                </a>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ADMIN ===== -->
    <div class="footer-admin">
        <h3><i class="fa-solid fa-lock"></i> Khu vực quản trị</h3>
        <div class="login-area" id="loginArea">
            <input type="password" id="secretInput" placeholder="Nhập mã bí mật...">
            <button class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button>
        </div>
        <div class="logout-area" id="logoutArea">
            <p><i class="fa-regular fa-circle-check"></i> Đã đăng nhập quyền Admin</p>
            <button class="btn-logout"><i class="fa-solid fa-sign-out-alt"></i> Đăng xuất</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <script>
        // ===== CONFIG =====
        const SECRET_CODE = "eveujrmx";
        const BIN_ID = "6a829050da38895dfeed7295";
        const MASTER_KEY = "$2a$10$bdgqB5/wPv/M89cWFqr2X.YEasNmIrnSkUItLWt03Td44GQmacSP2";

        let isAdmin = localStorage.getItem("isAdmin") === "true";
        let posts = [];
        let base64Image = "";

        // Cache DOM elements
        const adminPanel = document.getElementById("adminPanel");
        const loginArea = document.getElementById("loginArea");
        const logoutArea = document.getElementById("logoutArea");
        const postsContainer = document.getElementById("postsContainer");
        const formHeading = document.getElementById("formHeading");
        const editPostId = document.getElementById("editPostId");
        const postTitle = document.getElementById("postTitle");
        const postDesc = document.getElementById("postDesc");
        const postRedirect = document.getElementById("postRedirect");
        const imageUpload = document.getElementById("imageUpload");
        const submitBtn = document.getElementById("submitBtn");
        const cancelEditBtn = document.getElementById("cancelEditBtn");
        const secretInput = document.getElementById("secretInput");
        const modalOverlay = document.getElementById("downloadModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalContent = document.getElementById("modalContent");
        const modalDownloadBtn = document.getElementById("modalDownloadBtn");

        // ===== INIT =====
        document.addEventListener("DOMContentLoaded", () => {
            if (isAdmin) {
                adminPanel.classList.add("active");
                loginArea.style.display = "none";
                logoutArea.classList.add("active");
            }
            fetchPosts();

            // Event listeners
            submitBtn.addEventListener("click", savePost);
            cancelEditBtn.addEventListener("click", resetForm);
            document.querySelector(".btn-login").addEventListener("click", loginAdmin);
            document.querySelector(".btn-logout").addEventListener("click", logoutAdmin);
            document.querySelector(".modal-close").addEventListener("click", closeModal);
            modalOverlay.addEventListener("click", closeModalOnOutside);
            imageUpload.addEventListener("change", handleImageUpload);
            secretInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") loginAdmin();
            });
        });

        // ===== AUTH =====
        function loginAdmin() {
            if (secretInput.value === SECRET_CODE) {
                localStorage.setItem("isAdmin", "true");
                location.reload();
            } else {
                secretInput.style.borderColor = "#ff2d75";
                secretInput.style.boxShadow = "0 0 0 3px rgba(255,45,117,0.2)";
                setTimeout(() => {
                    secretInput.style.borderColor = "";
                    secretInput.style.boxShadow = "";
                }, 1500);
            }
        }

        function logoutAdmin() {
            localStorage.removeItem("isAdmin");
            location.reload();
        }

        // ===== IMAGE UPLOAD =====
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    base64Image = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // ===== FETCH POSTS =====
        async function fetchPosts() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY },
                    cache: 'no-cache'
                });
                const data = await res.json();
                posts = data.record?.posts || [];
                renderPosts();
            } catch (e) {
                postsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-database"></i>
                        <h3>Không thể tải dữ liệu</h3>
                        <p style="color: var(--text-muted); font-size: 14px;">Vui lòng kiểm tra kết nối hoặc thử lại sau</p>
                    </div>
                `;
            }
        }

        // ===== SAVE TO JSONBIN =====
        async function saveToServer() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ posts: posts })
                });
                location.reload();
            } catch (e) {
                alert("Lỗi khi lưu dữ liệu. Vui lòng thử lại.");
            }
        }

        // ===== SAVE POST =====
        async function savePost() {
            const editId = editPostId.value;
            const title = postTitle.value.trim();
            const desc = postDesc.value.trim();
            const redirect = postRedirect.value.trim();

            if (!title) {
                postTitle.style.borderColor = "#ff2d75";
                postTitle.style.boxShadow = "0 0 0 3px rgba(255,45,117,0.2)";
                setTimeout(() => {
                    postTitle.style.borderColor = "";
                    postTitle.style.boxShadow = "";
                }, 1500);
                postTitle.focus();
                return;
            }

            if (editId) {
                posts = posts.map(p => {
                    if (p.id == editId) {
                        return {
                            ...p,
                            title,
                            desc,
                            redirectLink: redirect,
                            image: base64Image || p.image
                        };
                    }
                    return p;
                });
            } else {
                posts.unshift({
                    id: Date.now(),
                    title,
                    desc,
                    redirectLink: redirect,
                    image: base64Image
                });
            }
            saveToServer();
        }

        // ===== EDIT POST =====
        function editPost(id) {
            const p = posts.find(item => item.id == id);
            if (!p) return;
            editPostId.value = p.id;
            postTitle.value = p.title;
            postDesc.value = p.desc;
            postRedirect.value = p.redirectLink || "";
            base64Image = p.image || "";
            formHeading.innerText = "Sửa bài viết";
            submitBtn.innerHTML = `<i class="fa-regular fa-floppy-disk"></i> Lưu thay đổi`;
            cancelEditBtn.classList.add("active");
            adminPanel.classList.add("active");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== RESET FORM =====
        function resetForm() {
            editPostId.value = "";
            postTitle.value = "";
            postDesc.value = "";
            postRedirect.value = "";
            base64Image = "";
            imageUpload.value = "";
            formHeading.innerText = "Đăng bài viết mới";
            submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Đăng bài`;
            cancelEditBtn.classList.remove("active");
        }

        // ===== DELETE POST =====
        async function deletePost(id) {
            if (confirm("Bạn có chắc muốn xóa bài viết này?")) {
                posts = posts.filter(p => p.id !== id);
                saveToServer();
            }
        }

        // ===== LINKIFY =====
        function linkify(text) {
            if (!text) return "";
            return text.replace(
                /(https?:\/\/[^\s<>"']+)/g,
                '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
            );
        }

        // ===== MODAL =====
        function openDownloadModal(id) {
            const p = posts.find(item => item.id == id);
            if (!p) return;
            modalTitle.textContent = p.title;
            modalContent.innerHTML = linkify(p.desc.replace(/\n/g, '<br>'));

            if (p.redirectLink && p.redirectLink.trim() !== "") {
                modalDownloadBtn.style.display = 'inline-flex';
                modalDownloadBtn.href = p.redirectLink;
            } else {
                modalDownloadBtn.style.display = 'none';
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeModalOnOutside(e) {
            if (e.target === modalOverlay) {
                closeModal();
            }
        }

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // ===== RENDER POSTS =====
        function renderPosts() {
            if (!posts || posts.length === 0) {
                postsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-newspaper"></i>
                        <h3>Chưa có bài viết</h3>
                        <p style="color: var(--text-muted); font-size: 14px;">Hãy đăng bài viết đầu tiên ngay nào!</p>
                    </div>
                `;
                return;
            }

            postsContainer.innerHTML = `<div class="posts-grid">${
                posts.map(p => `
                    <div class="post-card">
                        <div class="post-title">
                            ${p.title}
                            <span class="post-id">#${p.id.toString().slice(-6)}</span>
                        </div>
                        ${p.image ? `<img src="${p.image}" class="post-image" alt="${p.title}" loading="lazy">` : ''}
                        <div class="post-desc">${linkify(p.desc.replace(/\n/g, '<br>'))}</div>
                        <div class="post-meta">
                            <button class="btn-download" onclick="openDownloadModal(${p.id})">
                                <i class="fa-solid fa-download"></i> Tải xuống
                            </button>
                        </div>
                        <div class="post-actions">
                            <button class="btn-edit ${isAdmin ? 'active' : ''}" onclick="editPost(${p.id})">
                                <i class="fa-regular fa-pen-to-square"></i> Sửa
                            </button>
                            <button class="btn-delete ${isAdmin ? 'active' : ''}" onclick="deletePost(${p.id})">
                                <i class="fa-regular fa-trash-can"></i> Xóa
                            </button>
                        </div>
                    </div>
                `).join('')
            }</div>`;
        }
    </script>
</body>
</html>

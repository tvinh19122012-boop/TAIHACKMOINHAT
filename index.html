<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Neon Hub - Pro Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0b0f19; --panel-bg: rgba(17, 24, 39, 0.9); --neon-cyan: #00f3ff; --neon-pink: #ff0055; --text-color: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 50px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: rgba(11, 15, 25, 0.95); border-bottom: 2px solid var(--neon-cyan); position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; color: #fff; }
        .menu-icon { font-size: 24px; color: var(--neon-cyan); cursor: pointer; padding: 5px 10px; border: 1px solid var(--neon-cyan); border-radius: 4px; }
        .sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(10px); border-left: 2px solid var(--neon-cyan); transition: 0.4s; z-index: 1100; padding: 30px 20px; }
        .sidebar.active { right: 0; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        #admin-panel { display: none; background: var(--panel-bg); border: 2px dashed var(--neon-pink); padding: 25px; border-radius: 8px; margin-bottom: 40px; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group textarea { width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-cyan); padding: 12px; color: #fff; border-radius: 4px; }
        .post-card { background: var(--panel-bg); border: 1px solid var(--neon-cyan); border-radius: 8px; padding: 20px; margin-bottom: 25px; position: relative; }
        .post-title { font-family: 'Orbitron', sans-serif; font-size: 20px; color: #fff; margin-bottom: 10px; }
        .post-image { width: 100%; border-radius: 6px; margin-bottom: 15px; }
        .post-desc a { color: var(--neon-cyan); text-decoration: underline; }
        .download-btn { background: var(--neon-cyan); color: #000; padding: 10px 20px; font-weight: 700; text-decoration: none; display: inline-block; border-radius: 4px; margin-top: 10px; }
        .neon-btn { background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-family: 'Orbitron'; }
        .delete-btn { background: #ff0055; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">GAMING<span>HUB</span></div>
        <div class="menu-icon" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
    </header>

    <div class="sidebar" id="sidebar">
        <h3>BẢO MẬT</h3>
        <input type="password" id="secret-code-input" placeholder="Mã bí mật..." style="width:100%; padding:10px; background:#000; color:#fff; border:1px solid var(--neon-cyan);">
        <button class="neon-btn" onclick="loginAdmin()">ĐĂNG NHẬP</button>
        <button class="neon-btn" id="logout-btn" style="display:none; border-color:red; color:red;" onclick="logoutAdmin()">ĐĂNG XUẤT</button>
    </div>

    <div class="container">
        <div id="admin-panel">
            <h2>ĐĂNG BÀI VIẾT MỚI</h2>
            <div class="form-group"><input type="text" id="post-title" placeholder="Tên bài viết"></div>
            <div class="form-group"><textarea id="post-desc" rows="3" placeholder="Mô tả..."></textarea></div>
            <div class="form-group"><input type="text" id="post-redirect-link" placeholder="Link tải"></div>
            <input type="file" id="image-upload" accept="image/*">
            <button class="neon-btn" onclick="createPost()">ĐĂNG BÀI LÊN CLOUD</button>
        </div>
        <div id="posts-container">Đang tải dữ liệu...</div>
    </div>

    <script>
        const SECRET_CODE = "eveujrmx";
        const BIN_ID = "6a829050da38895dfeed7295"; 
        const MASTER_KEY = "$2a$10$bdgqB5/wPv/M89cWFqr2X.YEasNmIrnSkUItLWt03Td44GQmacSP2"; 

        let isAdmin = localStorage.getItem("isAdmin") === "true";
        let posts = [];
        let base64Image = "";

        window.onload = () => { 
            if(isAdmin) {
                document.getElementById("admin-panel").style.display = "block";
                document.getElementById("logout-btn").style.display = "block";
            }
            fetchPostsFromCloud(); 
        };

        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); }

        function loginAdmin() {
            if (document.getElementById("secret-code-input").value === SECRET_CODE) {
                localStorage.setItem("isAdmin", "true");
                location.reload();
            } else alert("Sai mã!");
        }

        function logoutAdmin() { localStorage.setItem("isAdmin", "false"); location.reload(); }

        document.getElementById('image-upload').onchange = function(e) {
            const reader = new FileReader();
            reader.onload = (e) => base64Image = e.target.result;
            reader.readAsDataURL(e.target.files[0]);
        };

        async function fetchPostsFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
                const data = await res.json();
                posts = data.record.posts || [];
                renderPosts();
            } catch (e) { document.getElementById("posts-container").innerText = "Chưa có bài viết!"; }
        }

        async function saveToCloud() {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify({ posts: posts })
            });
            location.reload();
        }

        async function createPost() {
            posts.unshift({
                id: Date.now(),
                title: document.getElementById("post-title").value,
                desc: document.getElementById("post-desc").value,
                redirectLink: document.getElementById("post-redirect-link").value,
                image: base64Image
            });
            saveToCloud();
        }

        async function deletePost(id) {
            if(confirm("Bạn có chắc muốn xóa bài này?")) {
                posts = posts.filter(p => p.id !== id);
                saveToCloud();
            }
        }

        function renderPosts() {
            document.getElementById("posts-container").innerHTML = posts.map(p => `
                <div class="post-card">
                    <div class="post-title">${p.title}</div>
                    ${p.image ? `<img src="${p.image}" class="post-image">` : ''}
                    <div class="post-desc">${p.desc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')}</div>
                    <a href="${p.redirectLink}" target="_blank" class="download-btn">TẢI NGAY</a>
                    <br><button class="delete-btn" style="display:${isAdmin ? 'block' : 'none'}" onclick="deletePost(${p.id})">XÓA BÀI NÀY</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>

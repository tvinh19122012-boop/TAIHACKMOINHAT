<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Hub</title>
    <noscript>
        <p style="font-family:sans-serif;padding:40px;text-align:center">Trang web này cần bật JavaScript để hiển thị. Vui lòng bật JavaScript trong trình duyệt của bạn.</p>
    </noscript>
</head>
<body>

    <!-- Gọi file JavaScript chứa toàn bộ ruột HTML đã được mã hóa siêu mạnh -->
    <script src="render_obfuscated.js"></script>

    <script>
        // Chèn thêm đoạn code chặn F12 và chuột phải để bảo vệ vòng ngoài
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        }
    </script>
</body>
</html>

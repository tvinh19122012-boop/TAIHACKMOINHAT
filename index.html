<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Hub - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f7f7f3;
            --bg-elevated: #ffffff;
            --border: #e6e4dc;
            --border-strong: #d7d4c8;
            --ink: #1d1e1a;
            --ink-soft: #62645a;
            --ink-mute: #9a9c8f;
            --accent: #3450db;
            --accent-ink: #2540b8;
            --accent-soft: #eaedfb;
            --go: #0f9d63;
            --go-ink: #0b7f50;
            --go-soft: #e5f6ee;
            --warn: #b5790a;
            --warn-soft: #fbf1de;
            --danger: #cf3f5b;
            --danger-soft: #fbeaee;
            --radius: 14px;
            --radius-sm: 9px;
            --shadow-sm: 0 1px 2px rgba(30, 30, 20, 0.05);
            --shadow-md: 0 10px 30px rgba(30, 30, 20, 0.08);
            --shadow-lg: 0 24px 60px rgba(30, 30, 20, 0.16);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        h1, h2, h3, .brand-mark {
            font-family: 'Manrope', 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 4px;
        }
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(247, 247, 243, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-mark {
            font-size: 19px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .brand-mark .dot {
            width: 9px;
            height: 9px;
            border-radius: 3px;
            background: var(--accent);
            flex-shrink: 0;
        }
        .header-badge {
            font-size: 11.5px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            background: var(--accent-soft);
            color: var(--accent-ink);
            border: 1px solid rgba(52, 80, 219, 0.15);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-bypass {
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13.5px;
            background: var(--ink);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-bypass:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* ===== Hướng dẫn ===== */
        .guide-line {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ink-soft);
            margin-bottom: 22px;
            font-size: 14.5px;
            padding: 12px 16px;
            background: var(--accent-soft);
            border-radius: var(--radius-sm);
        }
        .guide-line i {
            color: var(--accent);
            font-size: 15px;
            flex-shrink: 0;
        }
        .guide-line strong {
            color: var(--ink);
            font-weight: 700;
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px 28px;
            margin-bottom: 28px;
            display: none;
            box-shadow: var(--shadow-md);
        }
        .admin-panel.active {
            display: block;
            animation: fadeSlideIn 0.35s ease;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-header h2 {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .admin-header h2 i {
            color: var(--accent);
            font-size: 16px;
        }
        .admin-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            background: var(--danger-soft);
            color: var(--danger);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-grid .full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--ink);
            font-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn-primary {
            padding: 11px 26px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            background: var(--accent-ink);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            padding: 11px 26px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            background: transparent;
            color: var(--ink-soft);
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }
        .btn-secondary:hover {
            background: var(--bg);
            color: var(--ink);
        }
        .btn-secondary.active {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== POSTS GRID ===== */
        .posts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .post-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 26px;
            transition: var(--transition);
        }
        .post-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
        }
        .post-card .post-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .post-card .post-title .post-id {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ink-mute);
            background: var(--bg);
            padding: 2px 9px;
            border-radius: 12px;
        }
        .post-card .post-image {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin: 12px 0 14px;
            border: 1px solid var(--border);
        }
        .post-card .post-desc {
            display: none;
        }
        .post-card .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .btn-download {
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            background: var(--go);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-download:hover {
            background: var(--go-ink);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-download:active {
            transform: scale(0.98);
        }
        .post-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .btn-edit {
            padding: 6px 14px;
            border-radius: 7px;
            font-weight: 600;
            font-size: 12.5px;
            background: var(--warn-soft);
            color: var(--warn);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: none;
            align-items: center;
            gap: 6px;
        }
        .btn-edit:hover {
            filter: brightness(0.95);
        }
        .btn-delete {
            padding: 6px 14px;
            border-radius: 7px;
            font-weight: 600;
            font-size: 12.5px;
            background: var(--danger-soft);
            color: var(--danger);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: none;
            align-items: center;
            gap: 6px;
        }
        .btn-delete:hover {
            filter: brightness(0.95);
        }
        .btn-edit.active,
        .btn-delete.active {
            display: inline-flex;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 15, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.25s ease;
            box-shadow: var(--shadow-lg);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 18px;
            background: var(--bg);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: var(--ink-soft);
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-close:hover {
            color: var(--ink);
            background: var(--border);
        }
        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 18px;
            padding-right: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
        }
        .modal-content {
            color: var(--ink-soft);
            font-size: 14.5px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .modal-content a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: var(--transition);
            font-weight: 600;
        }
        .modal-content a:hover {
            color: var(--accent-ink);
        }
        .modal-actions {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border);
            padding-top: 18px;
        }
        .modal-download-btn {
            padding: 13px 36px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            background: var(--go);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .modal-download-btn:hover {
            background: var(--go-ink);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .modal-download-btn:active {
            transform: scale(0.98);
        }

        /* ===== FOOTER ADMIN ===== */
        .footer-admin {
            max-width: 720px;
            margin: 36px auto 0;
            padding: 22px 26px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-align: center;
        }
        .footer-admin h3 {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .footer-admin h3 i {
            color: var(--ink-mute);
        }
        .footer-admin .login-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }
        .footer-admin .login-area input {
            padding: 10px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--ink);
            font-size: 14px;
            min-width: 220px;
            transition: var(--transition);
        }
        .footer-admin .login-area input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .footer-admin .login-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .footer-admin .login-area .btn-login {
            padding: 10px 26px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            background: var(--ink);
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
        }
        .footer-admin .login-area .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .footer-admin .login-area .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .footer-admin .login-hint {
            width: 100%;
            font-size: 12.5px;
            color: var(--danger);
            margin-top: 8px;
            display: none;
        }
        .footer-admin .login-hint.active {
            display: block;
        }
        .footer-admin .logout-area {
            display: none;
        }
        .footer-admin .logout-area.active {
            display: block;
        }
        .footer-admin .logout-area p {
            color: var(--go-ink);
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .footer-admin .logout-area .btn-logout {
            padding: 10px 26px;
            border: 1px solid var(--danger);
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            background: transparent;
            color: var(--danger);
            cursor: pointer;
            transition: var(--transition);
        }
        .footer-admin .logout-area .btn-logout:hover {
            background: var(--danger-soft);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-mute);
        }
        .empty-state i {
            font-size: 40px;
            margin-bottom: 16px;
            display: block;
            color: var(--border-strong);
        }
        .empty-state h3 {
            font-size: 17px;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            gap: 12px;
            color: var(--ink-mute);
        }
        .loading-spinner i {
            font-size: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .brand-mark {
                font-size: 17px;
            }
            .header-badge {
                font-size: 10px;
                padding: 3px 10px;
            }
            .btn-bypass {
                font-size: 13px;
                padding: 7px 15px;
            }
            .container {
                padding: 18px 14px 40px;
            }
            .admin-panel {
                padding: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .post-card {
                padding: 18px 18px;
            }
            .post-card .post-title {
                font-size: 16.5px;
            }
            .modal-box {
                padding: 20px;
            }
            .footer-admin {
                padding: 18px 16px;
            }
            .footer-admin .login-area {
                flex-direction: column;
            }
            .footer-admin .login-area input {
                min-width: unset;
                width: 100%;
            }
        }
        @media (max-width: 480px) {
            .header-right .btn-bypass span {
                display: none;
            }
            .header-right .btn-bypass i {
                margin: 0;
            }
        }

        /* ===== OPTIMIZATION ===== */
        .post-card,
        .btn-download,
        .modal-download-btn,
        .btn-bypass,
        .btn-primary,
        .btn-login,
        .btn-logout {
            -webkit-tap-highlight-color: transparent;
        }
        img {
            content-visibility: auto;
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <div class="brand-mark"><span class="dot"></span>Download Hub</div>
            <span class="header-badge">v3.0</span>
        </div>
        <div class="header-right">
            <a href="https://tvinh19122012-boop.github.io/BYPASS-WEB" target="_blank" class="btn-bypass" rel="noopener noreferrer">
                <i class="fa-solid fa-rocket"></i> <span>Bypass Key</span>
            </a>
        </div>
    </header>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <div class="guide-line">
            <i class="fa-regular fa-circle-question"></i>
            <span>Ấn vào <strong>"Tải xuống"</strong> để xem các link tải.</span>
        </div>

        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-header">
                <h2><i class="fa-solid fa-pen-to-square"></i> <span id="formHeading">Đăng bài viết mới</span></h2>
                <span class="admin-badge">Quản trị</span>
            </div>
            <input type="hidden" id="editPostId" value="">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Tiêu đề</label>
                    <input type="text" id="postTitle" placeholder="Nhập tiêu đề bài viết...">
                </div>
                <div class="form-group full-width">
                    <label>Mô tả (Nơi chứa các link tải)</label>
                    <textarea id="postDesc" rows="4" placeholder="Nhập nội dung chứa các link vào đây...&#10;Ví dụ:&#10;Link tải game: https://example.com/game.apk&#10;Link dự phòng: https://example.com/backup"></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Link đích (Nút tải xuống ngay bên trong màn popup)</label>
                    <input type="text" id="postRedirect" placeholder="https://example.com/download">
                </div>
                <div class="form-group full-width">
                    <label>Hình ảnh</label>
                    <input type="file" id="imageUpload" accept="image/*" style="padding: 8px;">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn-primary" id="submitBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Đăng bài</button>
                <button class="btn-secondary" id="cancelEditBtn"><i class="fa-solid fa-xmark"></i> Hủy sửa</button>
            </div>
        </div>

        <!-- POSTS -->
        <div id="postsContainer">
            <div class="loading-spinner"><i class="fa-solid fa-spinner"></i> Đang tải dữ liệu...</div>
        </div>

    </div>

    <!-- ===== MODAL ===== -->
    <div id="downloadModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalTitle" class="modal-title">Tiêu đề bài viết</h3>
            <div id="modalContent" class="modal-content">Nội dung các link sẽ hiện ra ở đây...</div>

            <div class="modal-actions">
                <a id="modalDownloadBtn" href="#" target="_blank" rel="noopener noreferrer" class="modal-download-btn" style="display: none;">
                    <i class="fa-solid fa-download"></i> Tải xuống ngay
                </a>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ADMIN ===== -->
    <div class="footer-admin">
        <h3><i class="fa-solid fa-lock"></i> Khu vực quản trị</h3>
        <div class="login-area" id="loginArea">
            <input type="password" id="secretInput" placeholder="Nhập mã bí mật..." autocomplete="off">
            <button class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button>
            <div class="login-hint" id="loginHint">Sai mã quá nhiều lần, thử lại sau ít giây.</div>
        </div>
        <div class="logout-area" id="logoutArea">
            <p><i class="fa-regular fa-circle-check"></i> Đã đăng nhập quyền Admin</p>
            <button class="btn-logout"><i class="fa-solid fa-sign-out-alt"></i> Đăng xuất</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <script>
        // ===== CONFIG =====
        // Lưu ý: đây vẫn là mã chạy phía trình duyệt (client-side), nên bất kỳ ai
        // mở DevTools / tab Network đều có thể đọc được các giá trị này khi trang
        // gọi API. Việc encode dưới đây chỉ ngăn được kiểu "view-source rồi Ctrl+F"
        // thông thường, không phải một lớp bảo mật thật sự. Muốn giấu triệt để,
        // bắt buộc phải chuyển phần xác thực + gọi JSONBin sang một backend/serverless
        // proxy, để khoá bí mật không bao giờ rời khỏi server.
        const SECRET_CODE = atob("ZXZldWpybXg=");
        const BIN_ID = atob("NmE4MjkwNTBkYTM4ODk1ZGZlZWQ3Mjk1");
        const MASTER_KEY = atob("JDJhJDEwJGJkZ3FCNS93UHYvTTg5Y1dGcXIyWC5ZRWFzTm1JclNrVUl0TFd0MDNUZDQ0R1FtYWNTUDI=");

        let isAdmin = localStorage.getItem("isAdmin") === "true";
        let posts = [];
        let base64Image = "";
        let loginAttempts = 0;
        let lockedUntil = 0;

        // Cache DOM elements
        const adminPanel = document.getElementById("adminPanel");
        const loginArea = document.getElementById("loginArea");
        const logoutArea = document.getElementById("logoutArea");
        const postsContainer = document.getElementById("postsContainer");
        const formHeading = document.getElementById("formHeading");
        const editPostId = document.getElementById("editPostId");
        const postTitle = document.getElementById("postTitle");
        const postDesc = document.getElementById("postDesc");
        const postRedirect = document.getElementById("postRedirect");
        const imageUpload = document.getElementById("imageUpload");
        const submitBtn = document.getElementById("submitBtn");
        const cancelEditBtn = document.getElementById("cancelEditBtn");
        const secretInput = document.getElementById("secretInput");
        const loginBtn = document.querySelector(".btn-login");
        const loginHint = document.getElementById("loginHint");
        const modalOverlay = document.getElementById("downloadModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalContent = document.getElementById("modalContent");
        const modalDownloadBtn = document.getElementById("modalDownloadBtn");

        // ===== INIT =====
        document.addEventListener("DOMContentLoaded", () => {
            if (isAdmin) {
                adminPanel.classList.add("active");
                loginArea.style.display = "none";
                logoutArea.classList.add("active");
            }
            fetchPosts();

            // Event listeners
            submitBtn.addEventListener("click", savePost);
            cancelEditBtn.addEventListener("click", resetForm);
            loginBtn.addEventListener("click", loginAdmin);
            document.querySelector(".btn-logout").addEventListener("click", logoutAdmin);
            document.querySelector(".modal-close").addEventListener("click", closeModal);
            modalOverlay.addEventListener("click", closeModalOnOutside);
            imageUpload.addEventListener("change", handleImageUpload);
            secretInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") loginAdmin();
            });
        });

        // ===== ESCAPE HTML (chống XSS khi render dữ liệu người dùng nhập) =====
        function escapeHTML(str) {
            if (!str) return "";
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        // ===== AUTH =====
        function loginAdmin() {
            if (Date.now() < lockedUntil) return;

            if (secretInput.value === SECRET_CODE) {
                loginAttempts = 0;
                localStorage.setItem("isAdmin", "true");
                location.reload();
            } else {
                loginAttempts++;
                secretInput.style.borderColor = "#cf3f5b";
                secretInput.style.boxShadow = "0 0 0 3px rgba(207,63,91,0.15)";
                setTimeout(() => {
                    secretInput.style.borderColor = "";
                    secretInput.style.boxShadow = "";
                }, 1500);

                // Chống dò mã bằng tay: khoá tạm sau 5 lần sai liên tiếp
                if (loginAttempts >= 5) {
                    lockedUntil = Date.now() + 30000;
                    secretInput.disabled = true;
                    loginBtn.disabled = true;
                    loginHint.classList.add("active");
                    setTimeout(() => {
                        secretInput.disabled = false;
                        loginBtn.disabled = false;
                        loginHint.classList.remove("active");
                        loginAttempts = 0;
                    }, 30000);
                }
            }
        }

        function logoutAdmin() {
            localStorage.removeItem("isAdmin");
            location.reload();
        }

        // ===== IMAGE UPLOAD =====
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    base64Image = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // ===== FETCH POSTS =====
        async function fetchPosts() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY },
                    cache: 'no-cache'
                });
                const data = await res.json();
                posts = data.record?.posts || [];
                renderPosts();
            } catch (e) {
                postsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-database"></i>
                        <h3>Không thể tải dữ liệu</h3>
                        <p style="color: var(--ink-mute); font-size: 14px;">Vui lòng kiểm tra kết nối hoặc thử lại sau</p>
                    </div>
                `;
            }
        }

        // ===== SAVE TO JSONBIN =====
        async function saveToServer() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ posts: posts })
                });
                location.reload();
            } catch (e) {
                alert("Lỗi khi lưu dữ liệu. Vui lòng thử lại.");
            }
        }

        // ===== SAVE POST =====
        async function savePost() {
            const editId = editPostId.value;
            const title = postTitle.value.trim();
            const desc = postDesc.value.trim();
            const redirect = postRedirect.value.trim();

            if (!title) {
                postTitle.style.borderColor = "#cf3f5b";
                postTitle.style.boxShadow = "0 0 0 3px rgba(207,63,91,0.15)";
                setTimeout(() => {
                    postTitle.style.borderColor = "";
                    postTitle.style.boxShadow = "";
                }, 1500);
                postTitle.focus();
                return;
            }

            if (editId) {
                posts = posts.map(p => {
                    if (p.id == editId) {
                        return {
                            ...p,
                            title,
                            desc,
                            redirectLink: redirect,
                            image: base64Image || p.image
                        };
                    }
                    return p;
                });
            } else {
                posts.unshift({
                    id: Date.now(),
                    title,
                    desc,
                    redirectLink: redirect,
                    image: base64Image
                });
            }
            saveToServer();
        }

        // ===== EDIT POST =====
        function editPost(id) {
            const p = posts.find(item => item.id == id);
            if (!p) return;
            editPostId.value = p.id;
            postTitle.value = p.title;
            postDesc.value = p.desc;
            postRedirect.value = p.redirectLink || "";
            base64Image = p.image || "";
            formHeading.innerText = "Sửa bài viết";
            submitBtn.innerHTML = `<i class="fa-regular fa-floppy-disk"></i> Lưu thay đổi`;
            cancelEditBtn.classList.add("active");
            adminPanel.classList.add("active");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== RESET FORM =====
        function resetForm() {
            editPostId.value = "";
            postTitle.value = "";
            postDesc.value = "";
            postRedirect.value = "";
            base64Image = "";
            imageUpload.value = "";
            formHeading.innerText = "Đăng bài viết mới";
            submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Đăng bài`;
            cancelEditBtn.classList.remove("active");
        }

        // ===== DELETE POST =====
        async function deletePost(id) {
            if (confirm("Bạn có chắc muốn xóa bài viết này?")) {
                posts = posts.filter(p => p.id !== id);
                saveToServer();
            }
        }

        // ===== LINKIFY (áp dụng sau khi đã escape để tránh HTML injection) =====
        function linkify(escapedText) {
            if (!escapedText) return "";
            return escapedText.replace(
                /(https?:\/\/[^\s<>"']+)/g,
                '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
            );
        }

        // ===== MODAL =====
        function openDownloadModal(id) {
            const p = posts.find(item => item.id == id);
            if (!p) return;
            modalTitle.textContent = p.title;
            modalContent.innerHTML = linkify(escapeHTML(p.desc).replace(/\n/g, '<br>'));

            if (p.redirectLink && p.redirectLink.trim() !== "") {
                modalDownloadBtn.style.display = 'inline-flex';
                modalDownloadBtn.href = p.redirectLink;
            } else {
                modalDownloadBtn.style.display = 'none';
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeModalOnOutside(e) {
            if (e.target === modalOverlay) {
                closeModal();
            }
        }

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // ===== RENDER POSTS =====
        function renderPosts() {
            if (!posts || posts.length === 0) {
                postsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-newspaper"></i>
                        <h3>Chưa có bài viết</h3>
                        <p style="color: var(--ink-mute); font-size: 14px;">Hãy đăng bài viết đầu tiên ngay nào!</p>
                    </div>
                `;
                return;
            }

            postsContainer.innerHTML = `<div class="posts-grid">${
                posts.map(p => `
                    <div class="post-card">
                        <div class="post-title">
                            ${escapeHTML(p.title)}
                            <span class="post-id">#${p.id.toString().slice(-6)}</span>
                        </div>
                        ${p.image ? `<img src="${p.image}" class="post-image" alt="${escapeHTML(p.title)}" loading="lazy">` : ''}
                        <div class="post-desc">${linkify(escapeHTML(p.desc).replace(/\n/g, '<br>'))}</div>
                        <div class="post-meta">
                            <button class="btn-download" onclick="openDownloadModal(${p.id})">
                                <i class="fa-solid fa-download"></i> Tải xuống
                            </button>
                        </div>
                        <div class="post-actions">
                            <button class="btn-edit ${isAdmin ? 'active' : ''}" onclick="editPost(${p.id})">
                                <i class="fa-regular fa-pen-to-square"></i> Sửa
                            </button>
                            <button class="btn-delete ${isAdmin ? 'active' : ''}" onclick="deletePost(${p.id})">
                                <i class="fa-regular fa-trash-can"></i> Xóa
                            </button>
                        </div>
                    </div>
                `).join('')
            }</div>`;
        }
    </script>
</body>
</html>
